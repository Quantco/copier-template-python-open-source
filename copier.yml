# configuration
_subdirectory: template
_preserve_symlinks: True
_min_copier_version: "9.3.1"

# questions
project_slug:
  type: str
  help: What is your project slug (i.e. pypi package name)?
  validator: >-
    {% if '_' in project_slug or ' ' in project_slug or '.' in project_slug %} The project slug should not contain underscores, spaces or dots. {% endif %}


project_slug_snake_case:
  type: str
  default: "{{ project_slug.replace('-', '_') }}"
  when: false

project_short_description:
  type: str
  help: Enter a short description.

github_user:
  type: str
  help: What is your GitHub username (used for CODEOWNERS)?

author_name:
  type: str
  help: What is your name (used for package author)?

author_email:
  type: str
  help: What is your email (used for package author)?
  validator: >-
    {% if not (author_email | regex_search('^.*@.*$')) %} Invalid email {% endif %}


repository_owner:
  type: str
  help: What is the GitHub organisation / user of this project, under which the repository will be hosted?
  default: "energy-models"
  validator: >-
    {% if not (repository_owner | regex_search('^[^\\s]+$')) %} Repository owner cannot contain spaces {% endif %}


github_url:
  type: str
  default: https://github.com/{{ repository_owner }}/{{ project_slug }}
  when: false

docs_url:
  type: str
  default: https://{{ project_slug }}.readthedocs.io
  when: false

minimal_python_version:
  type: str
  help: What is the minimal Python version you want to support?
  choices:
    - py312
    - py313
    - py314
  default: py312

license:
  help: Choose a license for your project.
  default: MIT
  choices:
    "MIT license":
      value: MIT
    "BSD license":
      value: BSD
    "Apache Software License 2.0":
      value: Apache-2.0
    "GNU General Public License v3":
      value: GPL-v3

use_devcontainer:
  type: bool
  help: Should this project use a devcontainer for development?
  default: false

add_autobump_workflow:
  type: bool
  help: Do you want to add a GitHub Workflow to automatically bump `pixi.lock`?
  default: true

_tasks:
  - "pixi exec --spec git git init"
  - "pixi run reuse download --all"
  - "pixi run pre-commit-install"
